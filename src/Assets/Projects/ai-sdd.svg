<svg xmlns="http://www.w3.org/2000/svg" width="960" height="620" viewBox="0 0 960 620" fill="none">
  <title>OpenSpec S0 + Viewer architecture</title>
  <desc>SDD Workspace creates one planning S0 per system. An authorized AI agent works with S0 and code repositories after functional and technical review. Independently distributed OpenSpec Viewer 0.3.2 reads local S0 files using its bundled engine.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="960" y2="620" gradientUnits="userSpaceOnUse">
      <stop stop-color="#231334"/><stop offset="1" stop-color="#120D20"/>
    </linearGradient>
    <marker id="write-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" stroke="#C399F9" stroke-width="1.5"/>
    </marker>
    <marker id="read-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" stroke="#78D5DA" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="960" height="620" rx="16" fill="url(#background)"/>
  <g font-family="Arial, sans-serif">
    <text x="40" y="49" fill="#D2B1FF" font-size="16" letter-spacing="2.5">TWO DISTRIBUTIONS / ONE S0 PER SYSTEM</text>

    <g stroke="#C399F9" stroke-width="2.5" marker-end="url(#write-arrow)">
      <path d="M280 170H349"/>
      <path d="M280 425H349"/>
      <path d="M610 425H669"/>
      <path d="M480 345V250" marker-start="url(#write-arrow)"/>
    </g>
    <path d="M680 170H611" stroke="#78D5DA" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#read-arrow)"/>
    <g fill="#CDB9E0" font-size="15" text-anchor="middle">
      <text x="315" y="144">creates</text>
      <text x="315" y="399">authorizes</text>
      <text x="645" y="399">writes</text>
    </g>
    <text x="645" y="144" fill="#9CE0E4" font-size="15" text-anchor="middle">reads</text>
    <text x="502" y="287" fill="#CDB9E0" font-size="16">plan +</text>
    <text x="502" y="310" fill="#CDB9E0" font-size="16">evidence</text>

    <rect x="40" y="100" width="240" height="140" rx="12" fill="#251B35" stroke="#755493"/>
    <rect x="360" y="100" width="240" height="140" rx="12" fill="#36224F" stroke="#C399F9"/>
    <rect x="680" y="100" width="240" height="140" rx="12" fill="#182A31" stroke="#78D5DA"/>
    <rect x="40" y="355" width="240" height="140" rx="12" fill="#251B35" stroke="#C399F9"/>
    <rect x="360" y="355" width="240" height="140" rx="12" fill="#36224F" stroke="#C399F9"/>
    <rect x="680" y="355" width="240" height="140" rx="12" fill="#251B35" stroke="#755493"/>

    <g fill="#F5F0FF" font-size="25" font-weight="600" text-anchor="middle">
      <text x="160" y="140">SDD Workspace</text>
      <text x="480" y="140">S0</text>
      <text x="800" y="140">Viewer 0.3.2</text>
      <text x="160" y="395">Human reviews</text>
      <text x="480" y="395">Authorized agent</text>
      <text x="800" y="395">Code repositories</text>
    </g>
    <g fill="#CEBEDF" font-size="18" text-anchor="middle">
      <text x="160" y="176">Template + creator</text>
      <text x="160" y="206">Guides + knowledge CLI</text>
      <text x="480" y="176">Context + specs + tasks</text>
      <text x="480" y="206">Versioned decisions</text>
      <text x="800" y="176" fill="#B6E5E8">Local, read-only VS Code</text>
      <text x="800" y="206" fill="#B6E5E8">Bundled graph engine</text>
      <text x="160" y="431">Functional + technical</text>
      <text x="160" y="461">Scope + implementation</text>
      <text x="480" y="431">Codex / Claude</text>
      <text x="480" y="461">Approved implementation</text>
      <text x="800" y="431">Single / mono / multi-repo</text>
      <text x="800" y="461">Existing Git boundaries</text>
    </g>

    <path d="M40 535H920" stroke="#523767"/>
    <path d="M40 576H80" stroke="#C399F9" stroke-width="2.5" marker-end="url(#write-arrow)"/>
    <text x="100" y="582" fill="#D9C7EB" font-size="18">Prepare / implement</text>
    <path d="M500 576H540" stroke="#78D5DA" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#read-arrow)"/>
    <text x="560" y="582" fill="#B6E5E8" font-size="18">Read local documents</text>
  </g>
</svg>
